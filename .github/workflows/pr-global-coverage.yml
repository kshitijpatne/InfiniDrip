name: PR global coverage

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'ops/**'
      - 'electron/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: pr-global-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  coverage:
    # EPIC-32 implementation PRs defer the one global run until the integrated
    # 56/56 candidate; the explicit final-gate branch opts back in. Other PRs
    # keep the existing global gate.
    if: ${{ !startsWith(github.event.pull_request.head.ref, 'codex/epic-32-') || startsWith(github.event.pull_request.head.ref, 'codex/epic-32-final-gate-') }}
    name: Full suite with 100% coverage
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out PR merge candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Verify hosted coverage heap limit
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          node -e 'const v8=require("node:v8"); const limit=v8.getHeapStatistics().heap_size_limit; console.log(`V8 heap limit: ${(limit/1024**3).toFixed(2)} GiB`); if (limit < 6*1024**3) throw new Error("V8 heap limit below 6 GiB");'

      - name: Run full suite with global coverage
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        # Follow vitest.config.ts: output-heavy coverage fixtures exceed the
        # hosted Node heap; keep one worker and provide bounded heap headroom.
        run: npm run coverage

  epic32_coverage_deferred:
    name: EPIC-32 global coverage deferred
    if: ${{ startsWith(github.event.pull_request.head.ref, 'codex/epic-32-') && !startsWith(github.event.pull_request.head.ref, 'codex/epic-32-final-gate-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Record final-gate boundary
        run: |
          echo "Global coverage is deferred until the integrated 56/56 EPIC-32 candidate is frozen."
          echo "Use a codex/epic-32-final-gate-* branch to run the full suite with 100% coverage."
