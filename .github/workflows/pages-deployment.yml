name: Deploy web preview to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Verify and deploy main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Verify hosted test heap limit
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          node -e 'const v8=require("node:v8"); const limit=v8.getHeapStatistics().heap_size_limit; console.log(`V8 heap limit: ${(limit/1024**3).toFixed(2)} GiB`); if (limit < 6*1024**3) throw new Error("V8 heap limit below 6 GiB");'

      - name: Run full test suite
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm test

      - name: Build production artifact
        run: npm run build

      - name: Verify deterministic web artifact
        run: |
          npm run web:manifest
          npm run web:proof:test

      - name: Deploy production artifact
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=infinidrip-preview --branch=main --commit-dirty=false
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
