<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InfiniDrip Control Center</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="topbar">
      <div><p class="eyebrow">LOCAL · CANONICAL BOARD.JSON</p><h1>Delivery Control Center</h1><p id="summary">Loading the board…</p></div>
      <div class="save-panel"><span id="save-state" class="save-state" role="status" aria-live="polite">Loading</span><button id="reload-button" type="button">Reload saved board</button></div>
    </header>
    <main class="workspace">
      <aside class="queue" aria-label="Delivery queue">
        <form id="filters" class="filters">
          <label class="wide">Search<input name="query" type="search" placeholder="Title, slice, text…"></label>
          <label>Status<select name="status"><option value="">All</option></select></label>
          <label>Owner<select name="owner"><option value="">All</option></select></label>
          <label>Priority<select name="priority"><option value="">All</option></select></label>
          <label>Type<select name="type"><option value="">All</option></select></label>
        </form>
        <div id="item-list" class="item-list"></div>
      </aside>
      <article id="detail" class="detail" aria-live="polite"></article>
    </main>
    <script type="module" src="./client.mjs"></script>
  </body>
</html>
