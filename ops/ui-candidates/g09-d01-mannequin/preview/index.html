<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; style-src 'self'; script-src 'self'">
<title>Mannequin Studio · D01</title>
<link rel="stylesheet" href="./style.css">
<script type="module" src="./main.mjs"></script>
</head>
<body>
<main>
<header><div><p class="brand">INFINIDRIP / D01</p><h1>Mannequin Studio</h1><p class="intro">Inspect a synthetic dress form and save its shape as a local GLB.</p></div>
<div class="files"><button id="open" disabled>Open GLB</button><input type="file" id="file" accept=".glb,model/gltf-binary" hidden><button id="save" class="primary" disabled>Download GLB</button></div></header>
<p id="status" role="status">Loading the local mannequin…</p>
<div class="layout">
<section class="viewport" aria-label="Mannequin view">
<div class="stage"><canvas tabindex="0" aria-label="3D mannequin orbit" aria-describedby="orbit-help"></canvas>
<span class="marker" hidden></span><p id="fallback" hidden></p></div>
<div class="toolbar"><small id="orbit-help">Drag or use arrow keys to orbit. Pinch or scroll to zoom.</small><div><button id="less" aria-label="Zoom out">−</button><button id="more" aria-label="Zoom in">+</button><button id="reset">Reset view</button></div></div>
</section>
<aside class="details">
<section><h2>Shape</h2><label for="shape">Verified configuration</label><select id="shape" disabled></select>
<p class="hint">Choose one of 43 tested shapes.</p><dl id="weights"></dl></section>
<section><h2>Measurements</h2><dl id="measurements"></dl></section>
<section><h2>Landmarks</h2><label for="landmark">Inspect a point</label><select id="landmark" disabled></select><p id="coordinates"></p></section>
</aside>
</div>
</main>
</body>
</html>
