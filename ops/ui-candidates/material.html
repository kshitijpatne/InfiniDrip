<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>UIQ-04 material clarity candidate preview</title>
    <link rel="stylesheet" href="../../src/ui/enhancements/foundation/foundation.css" />
    <link rel="stylesheet" href="../../src/ui/enhancements/material/material-panel.css" />
    <style>
      /* Page-chrome only. Scoped to elements outside .uiq-foundation/.uiq-material
         so it cannot affect the isolated candidate's own rules. */
      body {
        margin: 0;
        padding: 24px;
        background: #05080d;
        color: #cbd5df;
        font-family: system-ui, sans-serif;
      }
      h1 {
        font-size: 18px;
      }
      p.page-note {
        max-width: 60ch;
        font-size: 13px;
        color: #93a7b5;
      }
      .case-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 20px;
        margin-top: 20px;
      }
      .case {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
      }
      .case h2 {
        margin: 0;
        font-size: 13px;
        color: #cbd5df;
      }
      .case .log {
        font-size: 12px;
        color: #7ea0b4;
        min-height: 16px;
      }
      .two-mount-controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .two-mount-controls button {
        min-height: 44px;
        padding: 8px 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>UIQ-04 material clarity candidate — rendered preview</h1>
    <p class="page-note">
      Isolated native candidate. No production wiring: this page is a manual
      verification harness only, loaded directly by the Vite dev server, and
      is not part of the application build entry.
    </p>
    <div id="app"></div>
    <script type="module" src="./material-preview.ts"></script>
  </body>
</html>
